spring:
  application:
    name: interpretaai-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/interpretaai;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  mvc:
    log-request-details: false
debug: false
logging:
  level:
    org.springframework.web: INFO
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8088}
management:
  endpoints:
    web:
      exposure:
        include: health,info
interpretaai:
  identity:
    oidc-enabled: ${OIDC_ENABLED:false}
    issuer-uri: ${OIDC_ISSUER_URI:}
    audience: ${OIDC_AUDIENCE:interpretaai-api}
  media:
    storage: ${MEDIA_STORAGE:local}
    local-root: ${MEDIA_LOCAL_ROOT:./data/private-media}
    max-bytes: ${MEDIA_MAX_BYTES:10485760}
    upload-ttl-minutes: ${MEDIA_UPLOAD_TTL_MINUTES:15}
    max-dimension: ${MEDIA_MAX_DIMENSION:4096}
    max-pixels: ${MEDIA_MAX_PIXELS:16000000}
    max-sanitized-bytes: ${MEDIA_MAX_SANITIZED_BYTES:12582912}
    worker-enabled: ${MEDIA_WORKER_ENABLED:false}
    worker-poll-ms: ${MEDIA_WORKER_POLL_MS:500}
  device-pairing:
    enabled: ${DEVICE_PAIRING_ENABLED:false}
    secret: ${DEVICE_PAIRING_SECRET:}
    code-ttl-minutes: ${DEVICE_PAIRING_CODE_TTL_MINUTES:10}
    max-attempts-per-minute: ${DEVICE_PAIRING_MAX_ATTEMPTS_PER_MINUTE:10}
  authoring:
    worker-enabled: ${AUTHORING_WORKER_ENABLED:false}
    worker-poll-ms: ${AUTHORING_WORKER_POLL_MS:500}
    plan-worker-enabled: ${AUTHORING_PLAN_WORKER_ENABLED:false}
    plan-worker-poll-ms: ${AUTHORING_PLAN_WORKER_POLL_MS:500}
    model: ${AUTHORING_MODEL:}
  voice-auth:
    enabled: ${VOICE_AUTH_ENABLED:false}
  voice-rate-limit:
    enabled: ${VOICE_RATE_LIMIT_ENABLED:false}
    max-requests: ${VOICE_RATE_LIMIT_MAX_REQUESTS:8}
    window-seconds: ${VOICE_RATE_LIMIT_WINDOW_SECONDS:60}
  pilot-sync:
    enabled: ${PILOT_SYNC_ENABLED:false}
    teacher-token: ${PILOT_SYNC_TEACHER_TOKEN:}
    device-token: ${PILOT_SYNC_DEVICE_TOKEN:}
    secretary-token: ${PILOT_SYNC_SECRETARY_TOKEN:}
  scene-pack:
    version: ${SCENE_PACK_VERSION:v2}
  memory:
    max-sessions: ${SESSION_MEMORY_MAX_SESSIONS:2000}
    ttl-minutes: ${SESSION_MEMORY_TTL_MINUTES:10}
  conversation:
    provider: ${CONVERSATION_PROVIDER:ollama}
    deadline-ms: ${CONVERSATION_DEADLINE_MS:4000}
    provider-timeout-ms: ${CONVERSATION_PROVIDER_TIMEOUT_MS:3500}
    max-concurrent: ${CONVERSATION_MAX_CONCURRENT:2}
    route: ${CONVERSATION_ROUTE:ollama}
    routing-deadline-ms: ${CONVERSATION_ROUTING_DEADLINE_MS:4000}
    fast-failover-ms: ${CONVERSATION_FAST_FAILOVER_MS:350}
    failure-cooldown-ms: ${CONVERSATION_FAILURE_COOLDOWN_MS:5000}
    circuit:
      minimum-calls: ${CONVERSATION_CIRCUIT_MINIMUM_CALLS:4}
      window-size: ${CONVERSATION_CIRCUIT_WINDOW_SIZE:8}
      failure-rate: ${CONVERSATION_CIRCUIT_FAILURE_RATE:50}
      slow-rate: ${CONVERSATION_CIRCUIT_SLOW_RATE:50}
      slow-ms: ${CONVERSATION_CIRCUIT_SLOW_MS:2500}
      open-seconds: ${CONVERSATION_CIRCUIT_OPEN_SECONDS:20}
  idempotency:
    ttl-minutes: ${IDEMPOTENCY_TTL_MINUTES:10}
    processing-timeout-seconds: ${IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:30}
    fingerprint-secret: ${IDEMPOTENCY_FINGERPRINT_SECRET:local-development-only}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:1.5b}
    warmup-enabled: ${OLLAMA_WARMUP_ENABLED:true}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    thinking-level: ${GEMINI_THINKING_LEVEL:LOW}
    warmup-enabled: ${GEMINI_WARMUP_ENABLED:true}
  remote-warmup:
    initial-delay-ms: ${REMOTE_WARMUP_INITIAL_DELAY_MS:250}
    interval-ms: ${REMOTE_WARMUP_INTERVAL_MS:90000}
  nvidia:
    base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
    api-key: ${NVIDIA_API_KEY:}
    model: ${NVIDIA_MODEL:mistralai/mistral-nemotron}
    warmup-enabled: ${NVIDIA_WARMUP_ENABLED:true}
  speech:
    provider: ${SPEECH_PROVIDER:kokoro}
    cache-max-bytes: ${SPEECH_CACHE_MAX_BYTES:33554432}
    cache-ttl-minutes: ${SPEECH_CACHE_TTL_MINUTES:10}
  kokoro:
    base-url: ${KOKORO_BASE_URL:http://localhost:8091}
