spring:
  application:
    name: interpretaai-server
  mvc:
    log-request-details: false
debug: false
logging:
  level:
    org.springframework.web: INFO
server:
  port: ${PORT:8088}
management:
  endpoints:
    web:
      exposure:
        include: health,info
interpretaai:
  conversation:
    provider: ${CONVERSATION_PROVIDER:ollama}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
  speech:
    provider: ${SPEECH_PROVIDER:kokoro}
  kokoro:
    base-url: ${KOKORO_BASE_URL:http://localhost:8091}
