spring:
  application:
    name: interpretaai-server
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/interpretaai;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  mvc:
    log-request-details: false
debug: false
logging:
  level:
    org.springframework.web: INFO
server:
  port: ${PORT:8088}
management:
  endpoints:
    web:
      exposure:
        include: health,info
interpretaai:
  scene-pack:
    version: ${SCENE_PACK_VERSION:v2}
  memory:
    max-sessions: ${SESSION_MEMORY_MAX_SESSIONS:2000}
    ttl-minutes: ${SESSION_MEMORY_TTL_MINUTES:10}
  conversation:
    provider: ${CONVERSATION_PROVIDER:ollama}
    deadline-ms: ${CONVERSATION_DEADLINE_MS:4000}
    max-concurrent: ${CONVERSATION_MAX_CONCURRENT:2}
    route: ${CONVERSATION_ROUTE:ollama}
    routing-deadline-ms: ${CONVERSATION_ROUTING_DEADLINE_MS:4000}
    fast-failover-ms: ${CONVERSATION_FAST_FAILOVER_MS:350}
    failure-cooldown-ms: ${CONVERSATION_FAILURE_COOLDOWN_MS:5000}
    circuit:
      minimum-calls: ${CONVERSATION_CIRCUIT_MINIMUM_CALLS:4}
      window-size: ${CONVERSATION_CIRCUIT_WINDOW_SIZE:8}
      failure-rate: ${CONVERSATION_CIRCUIT_FAILURE_RATE:50}
      slow-rate: ${CONVERSATION_CIRCUIT_SLOW_RATE:50}
      slow-ms: ${CONVERSATION_CIRCUIT_SLOW_MS:2500}
      open-seconds: ${CONVERSATION_CIRCUIT_OPEN_SECONDS:20}
  idempotency:
    ttl-minutes: ${IDEMPOTENCY_TTL_MINUTES:10}
    processing-timeout-seconds: ${IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:30}
    fingerprint-secret: ${IDEMPOTENCY_FINGERPRINT_SECRET:local-development-only}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:1.5b}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    thinking-level: ${GEMINI_THINKING_LEVEL:LOW}
  nvidia:
    base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
    api-key: ${NVIDIA_API_KEY:}
    model: ${NVIDIA_MODEL:mistralai/mistral-nemotron}
    warmup-enabled: ${NVIDIA_WARMUP_ENABLED:true}
    warmup-initial-delay-ms: ${NVIDIA_WARMUP_INITIAL_DELAY_MS:250}
    warmup-interval-ms: ${NVIDIA_WARMUP_INTERVAL_MS:120000}
  speech:
    provider: ${SPEECH_PROVIDER:kokoro}
    cache-max-bytes: ${SPEECH_CACHE_MAX_BYTES:33554432}
    cache-ttl-minutes: ${SPEECH_CACHE_TTL_MINUTES:10}
  kokoro:
    base-url: ${KOKORO_BASE_URL:http://localhost:8091}
