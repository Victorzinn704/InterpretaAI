name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Scan committed content
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Android and server
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run JVM tests, lint and build
        run: >-
          ./gradlew --no-daemon
          :server:test :server:bootJar
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Run deterministic architecture checks
        run: |
          python3 tools/test-story-pack-validator.py
          python3 tools/test-teacher-usability-evaluator.py
          python3 tools/validate-guidance-sources.py
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-lint-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/
            app/build/test-results/
            server/build/reports/
            server/build/test-results/

  studio-prototype:
    name: Teacher studio prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-audit.txt
      - name: Install browser audit dependencies
        run: |
          pip install -r tools/requirements-audit.txt
          python -m playwright install --with-deps chromium
      - name: Exercise responsive teacher flow
        run: |
          python -m http.server 8099 --directory docs/v2/prototype > /tmp/interpretaai-studio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8099/ >/dev/null && break
            sleep 1
          done
          set +e
          python tools/audit-v2-studio.py 2>&1 | tee /tmp/interpretaai-studio-audit.log
          audit_status=${PIPESTATUS[0]}
          set -e
          if [ "$audit_status" -ne 0 ]; then
            summary=$(tail -n 25 /tmp/interpretaai-studio-audit.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Responsive Studio audit failed::$summary"
            exit "$audit_status"
          fi
      - name: Upload studio screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teacher-studio-screenshots
          if-no-files-found: ignore
          retention-days: 14
          path: output/screenshots/v2-studio/
