openapi: 3.1.0
info:
  title: InterpretaAI API v2
  version: 2.0.0-draft.2
  description: >-
    Contrato de projeto para autoria docente, publicação, entrega offline e evidências.
    Não representa uma API já implantada.
servers:
  - url: https://api.example.interpreta.ai/api/v2
    description: Endereço ilustrativo; nenhum ambiente é afirmado como ativo.
tags:
  - name: Identity
  - name: Media
  - name: Device Management
  - name: Authoring
  - name: Stories
  - name: Delivery
  - name: Evidence
security:
  - adultOidc: []

paths:
  /identity/me:
    get:
      tags: [Identity]
      operationId: getAdultContext
      summary: Retorna somente os contextos institucionais ativos do adulto autenticado
      responses:
        '200':
          description: Usuário e escolas autorizadas pelo banco
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdultContext'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Cria sessão curta para upload privado
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }

  /media/uploads/{mediaId}/content:
    put:
      tags: [Media]
      operationId: uploadPrivateMediaContent
      summary: Envia o conteúdo bruto para armazenamento privado temporário
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - name: mediaId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Conteúdo recebido; ainda requer sanitização e revisão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReceipt'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /authoring/jobs:
    post:
      tags: [Authoring]
      operationId: createAuthoringJob
      summary: Solicita uma proposta pedagógica assíncrona
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthoringJobRequest'
      responses:
        '202':
          description: Trabalho aceito
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringJob'
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /device-management/pairing-codes:
    post:
      tags: [Device Management]
      operationId: createDevicePairingCode
      summary: Cria código efêmero e de uso único para uma turma autorizada
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePairingCodeRequest' }
      responses:
        '201':
          description: Código exibido uma única vez ao adulto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /device-pairings/redeem:
    post:
      tags: [Device Management]
      operationId: redeemDevicePairingCode
      summary: Troca o código efêmero por credencial própria do aparelho
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemPairingRequest' }
      responses:
        '201':
          description: Credencial exibida uma única vez ao aparelho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCredential' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /device-management/devices/{deviceId}/revoke:
    post:
      tags: [Device Management]
      operationId: revokeDeviceCredential
      summary: Revoga imediatamente a credencial de um aparelho autorizado
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Aparelho revogado, inclusive em repetição idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceState' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /devices/{deviceId}/context:
    get:
      tags: [Device Management]
      operationId: getOwnDeviceContext
      summary: Confirma o próprio contexto depois do pareamento
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Contexto mínimo do próprio aparelho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceContext' }
        '401': { $ref: '#/components/responses/Problem' }

  /authoring/jobs/{jobId}:
    get:
      tags: [Authoring]
      operationId: getAuthoringJob
      summary: Consulta estado, progresso e resultado da autoria
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Estado atual
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringJob'
        '304': { description: Sem alteração }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /authoring/jobs/{jobId}/inputs:
    post:
      tags: [Authoring]
      operationId: submitAuthoringInput
      summary: Resolve ambiguidade ou solicita ajuste fechado
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthoringInput'
      responses:
        '202':
          description: Entrada aceita e trabalho retomado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringJob'
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /stories/{storyId}/versions/{version}/review:
    get:
      tags: [Stories]
      operationId: reviewStoryVersion
      summary: Devolve o rascunho e URLs privadas das variantes para revisão adulta
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/StoryId'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: Revisão autorizada, sem cache compartilhado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewBundle'
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /stories/{storyId}/versions/{version}/review/assets/{assetId}/{role}:
    get:
      tags: [Stories]
      operationId: previewStoryAsset
      summary: Entrega variante privada vinculada à versão para revisão adulta
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/StoryId'
        - $ref: '#/components/parameters/Version'
        - name: assetId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [PHONE, TABLET, THUMBNAIL, AUDIO] }
      responses:
        '200':
          description: Arquivo privado com ETag SHA-256 e Cache-Control no-store
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /stories/{storyId}/versions/{version}/approve:
    post:
      tags: [Stories]
      operationId: approveStoryVersion
      summary: Valida hash e mídias confirmadas e congela o snapshot aprovado
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/StoryId'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Versão aprovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryVersionState'
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /stories/{storyId}/versions/{version}/publish:
    post:
      tags: [Stories]
      operationId: publishStoryVersion
      summary: Publica uma versão previamente aprovada
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/StoryId'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Versão publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryVersionState'
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /assignments:
    post:
      tags: [Delivery]
      operationId: createAssignment
      summary: Atribui versão publicada; o corte local aceita turma e reserva grupo/dispositivo
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Atribuição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /assignments/{assignmentId}/preparation:
    get:
      tags: [Delivery]
      operationId: getAssignmentPreparation
      summary: Separa aparelhos compatíveis pareados de confirmações recentes de cache
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Estado técnico do preparo; não é evidência de uso ou aprendizagem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreparationSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /assignments/{assignmentId}/revoke:
    post:
      tags: [Delivery]
      operationId: withdrawAssignment
      summary: Retira da turma uma atribuição ativa sem despublicar a história
      parameters:
        - $ref: '#/components/parameters/SchoolContext'
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Atribuição retirada ou repetição idempotente }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /devices/{deviceId}/manifest:
    get:
      tags: [Delivery]
      operationId: getDeviceManifest
      summary: Retorna mudanças de conteúdo compatíveis com o aparelho
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: after
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Página incremental do manifesto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceManifest'
        '304': { description: Sem alteração }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /devices/{deviceId}/assignments/{assignmentId}/pack:
    get:
      tags: [Delivery]
      operationId: getOwnAssignedPack
      summary: Baixa os bytes exatos do pacote atribuído ao próprio aparelho
      description: >-
        No incremento local, esta rota autenticada por credencial do aparelho substitui uma URL
        assinada de objeto. Recursos usam a rota privada de variante e nunca o path do pacote.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: LearningStoryPack imutável com ETag igual ao SHA-256 anunciado
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /devices/{deviceId}/assignments/{assignmentId}/assets/{assetId}/{role}:
    get:
      tags: [Delivery]
      operationId: getOwnAssignedAsset
      summary: Baixa uma variante sanitizada declarada da história atribuída
      description: >-
        A variante é resolvida pelo vínculo imutável da versão publicada, não por uma URL ou path
        fornecido pelo pacote. O retorno usa ETag SHA-256 e Cache-Control no-store.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/AssignmentId'
        - name: assetId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [PHONE, TABLET, THUMBNAIL, AUDIO] }
      responses:
        '200':
          description: Bytes exatos da variante vinculada
          headers:
            ETag: { schema: { type: string, pattern: '^"[a-f0-9]{64}"$' } }
            Content-Length: { schema: { type: integer, minimum: 1 } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            audio/ogg: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /devices/{deviceId}/assignments/{assignmentId}/prepared:
    post:
      tags: [Delivery]
      operationId: confirmPreparedAssignment
      summary: Confirma que o app verificou o pacote e as variantes locais selecionadas
      description: >-
        É um recibo técnico renovável do aplicativo autenticado, não prova permanência futura do
        cache, abertura pela criança ou aprendizagem. A dupla atribuição/aparelho e o hash tornam
        a repetição idempotente.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreparedReceiptRequest' }
      responses:
        '200':
          description: Recibo registrado ou renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreparedReceipt' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /devices/{deviceId}/delivery-events:
    post:
      tags: [Delivery]
      operationId: createDeliveryEvent
      summary: Confirma recebimento e preparo pelo aparelho
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryEvent'
      responses:
        '202': { description: Evento aceito }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /learning-sessions:
    post:
      tags: [Evidence]
      operationId: createLearningSession
      summary: Cria contexto histórico imutável da jornada
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearningSessionRequest'
      responses:
        '201':
          description: Sessão aceita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSessionReceipt'
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /learning-events:batch:
    post:
      tags: [Evidence]
      operationId: appendLearningEvents
      summary: Sincroniza até cem eventos idempotentes
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningEventBatch'
      responses:
        '200':
          description: Resultado item a item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningEventBatchResult'
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /teacher-observations:
    post:
      tags: [Evidence]
      operationId: createTeacherObservation
      summary: Registra observação humana com histórico
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherObservationRequest'
      responses:
        '201':
          description: Observação registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherObservation'
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /reports/classrooms/{classroomId}:
    get:
      tags: [Evidence]
      operationId: getClassroomReport
      summary: Retorna evidências agregadas e limitações explícitas
      parameters:
        - $ref: '#/components/parameters/ClassroomId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Relatório contextualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomReport'
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    adultOidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example/.well-known/openid-configuration
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token

  parameters:
    SchoolContext:
      name: X-School-Id
      in: header
      required: true
      description: Contexto selecionado; a autorização é sempre reconferida no banco.
      schema: { $ref: '#/components/schemas/Id' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    StoryId:
      name: storyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ClassroomId:
      name: classroomId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  responses:
    Problem:
      description: Erro seguro e correlacionável
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Id:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{2,63}$'
    Timestamp:
      type: string
      format: date-time
    SchoolContext:
      type: object
      additionalProperties: false
      required: [schoolId, role]
      properties:
        schoolId: { $ref: '#/components/schemas/Id' }
        role: { type: string, enum: [TEACHER, COORDINATOR, SCHOOL_ADMIN] }
    AdultContext:
      type: object
      additionalProperties: false
      required: [userId, schools]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        schools:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SchoolContext' }
    CreatePairingCodeRequest:
      type: object
      additionalProperties: false
      required: [classroomId]
      properties:
        classroomId: { $ref: '#/components/schemas/Id' }
    PairingCode:
      type: object
      additionalProperties: false
      required: [pairingId, code, expiresAt]
      properties:
        pairingId: { $ref: '#/components/schemas/Id' }
        code: { type: string, pattern: '^[23456789A-HJ-NP-Z]{4}-[23456789A-HJ-NP-Z]{4}$' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        priority: { type: integer, minimum: 0, maximum: 100, default: 50 }
    RedeemPairingRequest:
      type: object
      additionalProperties: false
      required: [code, installationId, appVersion, architecture, viewportWidthDp, viewportHeightDp]
      properties:
        code: { type: string, minLength: 8, maxLength: 9 }
        installationId: { type: string, pattern: '^[A-Za-z0-9._:-]{16,128}$' }
        appVersion: { type: integer, minimum: 1 }
        architecture: { type: string, enum: [ARM64, UNIVERSAL, UNKNOWN] }
        viewportWidthDp: { type: integer, minimum: 240, maximum: 2000 }
        viewportHeightDp: { type: integer, minimum: 320, maximum: 3000 }
    DeviceCredential:
      type: object
      additionalProperties: false
      required: [deviceId, deviceToken, schoolId, classroomId, issuedAt]
      properties:
        deviceId: { $ref: '#/components/schemas/Id' }
        deviceToken: { type: string, minLength: 64, maxLength: 256, writeOnly: true }
        schoolId: { $ref: '#/components/schemas/Id' }
        classroomId: { $ref: '#/components/schemas/Id' }
        issuedAt: { $ref: '#/components/schemas/Timestamp' }
    DeviceState:
      type: object
      additionalProperties: false
      required: [deviceId, status]
      properties:
        deviceId: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [ACTIVE, REVOKED] }
    DeviceContext:
      type: object
      additionalProperties: false
      required: [deviceId, schoolId, classroomId, status]
      properties:
        deviceId: { $ref: '#/components/schemas/Id' }
        schoolId: { $ref: '#/components/schemas/Id' }
        classroomId: { $ref: '#/components/schemas/Id' }
        status: { type: string, const: ACTIVE }
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, mediaType, bytes, purpose]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 160 }
        mediaType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        bytes: { type: integer, minimum: 1, maximum: 10485760 }
        purpose: { type: string, const: STORY_SOURCE }
    UploadSession:
      type: object
      additionalProperties: false
      required: [mediaId, uploadUrl, expiresAt, maxBytes]
      properties:
        mediaId: { $ref: '#/components/schemas/Id' }
        uploadUrl: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        maxBytes: { type: integer }
    UploadReceipt:
      type: object
      additionalProperties: false
      required: [mediaId, status, bytes, sha256]
      properties:
        mediaId: { $ref: '#/components/schemas/Id' }
        status: { type: string, const: UPLOADED }
        bytes: { type: integer, minimum: 1, maximum: 10485760 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    Source:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, mediaId]
          properties:
            type: { const: TEACHER_UPLOAD }
            mediaId: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: [type, assetId]
          properties:
            type: { const: APPROVED_LIBRARY }
            assetId: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: [type, theme]
          properties:
            type: { const: THEME }
            theme: { type: string, minLength: 2, maxLength: 160 }
    CreateAuthoringJobRequest:
      type: object
      additionalProperties: false
      required: [objectiveIds, yearRange, durationMinutes, participationMode, source, requestedComponents]
      properties:
        objectiveIds:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
        yearRange: { type: string, enum: [1_YEAR, 2_YEAR, 3_YEAR, 4_YEAR, 5_YEAR, MIXED] }
        durationMinutes: { type: integer, minimum: 3, maximum: 40 }
        participationMode: { type: string, enum: [INDIVIDUAL, PAIR, GROUP] }
        source: { $ref: '#/components/schemas/Source' }
        confirmedWord: { type: string, minLength: 2, maxLength: 40 }
        teacherNotes: { type: string, maxLength: 1000 }
        requestedComponents:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [COMIC, PUZZLE, WORD_BUILDER, GROUP_HANDOFF] }
        reducedStimuliDefault: { type: boolean, default: false }
        externalProcessingConsentId: { $ref: '#/components/schemas/Id' }
    AuthoringJob:
      type: object
      required: [jobId, status, createdAt, updatedAt]
      properties:
        jobId: { $ref: '#/components/schemas/Id' }
        status:
          type: string
          enum: [QUEUED, ANALYZING_MEDIA, NEEDS_TEACHER_INPUT, RETRIEVING_GUIDANCE, GENERATING_STORY, GENERATING_MEDIA, VALIDATING, READY_FOR_REVIEW, FAILED_RETRYABLE, FAILED_FINAL, CANCELLED, APPROVED, PUBLISHED]
        progress:
          type: object
          required: [step, completedSteps, totalSteps]
          properties:
            step: { type: string }
            completedSteps: { type: integer, minimum: 0 }
            totalSteps: { type: integer, minimum: 1 }
        teacherInputRequest:
          type: object
          properties:
            questionId: { $ref: '#/components/schemas/Id' }
            prompt: { type: string, maxLength: 280 }
            choices: { type: array, items: { type: string }, maxItems: 8 }
        result:
          type: object
          properties:
            storyId: { $ref: '#/components/schemas/Id' }
            storyVersion: { type: integer, minimum: 1 }
            validationStatus: { type: string, enum: [BLOCKED, WARNINGS, VALID] }
            sourceRefs: { type: array, items: { $ref: '#/components/schemas/Id' } }
        failure: { $ref: '#/components/schemas/AuthoringFailure' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AuthoringFailure:
      type: object
      required: [code, retryable, safeMessage]
      properties:
        code: { type: string, enum: [authoring_preparation_failed] }
        retryable: { type: boolean }
        safeMessage: { type: string, maxLength: 280 }
    AuthoringInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [questionId, selectedChoice]
          properties:
            questionId: { $ref: '#/components/schemas/Id' }
            selectedChoice: { type: string, minLength: 1, maxLength: 120 }
        - type: object
          additionalProperties: false
          required: [action, storyNodeId]
          properties:
            action: { type: string, enum: [SHORTEN, SIMPLIFY_LANGUAGE, NEW_HINT, ADAPT_TO_PAIR, REGENERATE_IMAGE, REDO_SCENE] }
            storyNodeId: { $ref: '#/components/schemas/Id' }
            teacherText: { type: string, maxLength: 500 }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, expectedPackSha256, confirmedAssets, confirmedWarningIds]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        expectedPackSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        confirmedAssets:
          type: array
          maxItems: 400
          uniqueItems: true
          items: { $ref: '#/components/schemas/AssetConfirmation' }
        confirmedWarningIds:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    AssetConfirmation:
      type: object
      additionalProperties: false
      required: [assetId, role, sha256]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        role: { type: string, enum: [PHONE, TABLET, THUMBNAIL, AUDIO] }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    ReviewAsset:
      type: object
      required: [assetId, role, sha256, previewUrl]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        role: { type: string, enum: [PHONE, TABLET, THUMBNAIL, AUDIO] }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        previewUrl: { type: string, format: uri-reference }
    ReviewBundle:
      type: object
      required: [storyId, version, revision, state, packSha256, packJson, assets]
      properties:
        storyId: { $ref: '#/components/schemas/Id' }
        version: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        state: { type: string, enum: [DRAFT, APPROVED, PUBLISHED, ARCHIVED] }
        packSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        packJson: { type: string }
        assets:
          type: array
          items: { $ref: '#/components/schemas/ReviewAsset' }
    StoryVersionState:
      type: object
      required: [storyId, version, state, packSha256, updatedAt]
      properties:
        storyId: { $ref: '#/components/schemas/Id' }
        version: { type: integer, minimum: 1 }
        state: { type: string, enum: [DRAFT, APPROVED, PUBLISHED, ARCHIVED] }
        packSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AssignmentTarget:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [CLASSROOM, GROUP, DEVICE] }
        id: { $ref: '#/components/schemas/Id' }
    CreateAssignmentRequest:
      type: object
      additionalProperties: false
      required: [storyId, storyVersion, target, availableFrom]
      properties:
        storyId: { $ref: '#/components/schemas/Id' }
        storyVersion: { type: integer, minimum: 1 }
        target: { $ref: '#/components/schemas/AssignmentTarget' }
        availableFrom: { $ref: '#/components/schemas/Timestamp' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        priority: { type: integer, minimum: 0, maximum: 100, default: 50 }
    Assignment:
      allOf:
        - $ref: '#/components/schemas/CreateAssignmentRequest'
        - type: object
          required: [assignmentId, createdAt]
          properties:
            assignmentId: { $ref: '#/components/schemas/Id' }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
    ManifestItem:
      type: object
      required: [assignmentId, storyId, storyVersion, minAppVersion, packSha256, bytes, priority, downloadUrl]
      properties:
        assignmentId: { $ref: '#/components/schemas/Id' }
        storyId: { $ref: '#/components/schemas/Id' }
        storyVersion: { type: integer, minimum: 1 }
        minAppVersion: { type: integer, minimum: 1 }
        packSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        bytes: { type: integer, minimum: 1 }
        priority: { type: integer, minimum: 0, maximum: 100 }
        downloadUrl: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    DeviceManifest:
      type: object
      required: [items, nextCursor, serverTime]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManifestItem' } }
        nextCursor: { type: string }
        serverTime: { $ref: '#/components/schemas/Timestamp' }
    PreparedReceiptRequest:
      type: object
      additionalProperties: false
      required: [packSha256]
      properties:
        packSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    PreparedReceipt:
      type: object
      additionalProperties: false
      required: [assignmentId, deviceId, packSha256, lastConfirmedAt]
      properties:
        assignmentId: { $ref: '#/components/schemas/Id' }
        deviceId: { $ref: '#/components/schemas/Id' }
        packSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        lastConfirmedAt: { $ref: '#/components/schemas/Timestamp' }
    PreparationSummary:
      type: object
      additionalProperties: false
      required: [assignmentId, pairedCompatibleDevices, recentlyConfirmedDevices, observedAt, freshnessHours]
      properties:
        assignmentId: { $ref: '#/components/schemas/Id' }
        pairedCompatibleDevices: { type: integer, minimum: 0 }
        recentlyConfirmedDevices: { type: integer, minimum: 0 }
        lastConfirmationAt:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
        observedAt: { $ref: '#/components/schemas/Timestamp' }
        freshnessHours: { type: integer, minimum: 1 }
    DeliveryEvent:
      type: object
      additionalProperties: false
      required: [eventId, assignmentId, storyVersion, state, occurredAt]
      properties:
        eventId: { $ref: '#/components/schemas/Id' }
        assignmentId: { $ref: '#/components/schemas/Id' }
        storyVersion: { type: integer, minimum: 1 }
        state: { type: string, enum: [RECEIVED, PREPARING, READY, FAILED] }
        verifiedAssetCount: { type: integer, minimum: 0 }
        failureCode: { $ref: '#/components/schemas/Id' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
    CreateLearningSessionRequest:
      type: object
      additionalProperties: false
      required: [sessionId, assignmentId, storyId, storyVersion, classroomId, participantScope, deviceId, startedAt]
      properties:
        sessionId: { $ref: '#/components/schemas/Id' }
        assignmentId: { $ref: '#/components/schemas/Id' }
        storyId: { $ref: '#/components/schemas/Id' }
        storyVersion: { type: integer, minimum: 1 }
        classroomId: { $ref: '#/components/schemas/Id' }
        participantScope: { type: string, enum: [INDIVIDUAL, GROUP] }
        learnerAlias: { type: [string, 'null'], maxLength: 40 }
        groupMemberCount: { type: [integer, 'null'], minimum: 2, maximum: 4 }
        deviceId: { $ref: '#/components/schemas/Id' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
    LearningSessionReceipt:
      type: object
      required: [sessionId, receipt, acceptedAt]
      properties:
        sessionId: { $ref: '#/components/schemas/Id' }
        receipt: { type: string, minLength: 32, maxLength: 2048 }
        acceptedAt: { $ref: '#/components/schemas/Timestamp' }
    LearningEvent:
      type: object
      additionalProperties: false
      required: [eventId, sessionId, storyNodeId, objectiveId, eventType, modality, supportLevel, occurredAt, clientSequence, appVersion, packVersion]
      properties:
        eventId: { $ref: '#/components/schemas/Id' }
        sessionId: { $ref: '#/components/schemas/Id' }
        storyNodeId: { $ref: '#/components/schemas/Id' }
        interactionId: { $ref: '#/components/schemas/Id' }
        objectiveId: { $ref: '#/components/schemas/Id' }
        eventType:
          type: string
          enum: [SESSION_STARTED, NODE_PRESENTED, PROMPT_REPLAYED, RESPONSE_OFFERED, SUPPORT_REQUESTED, SUPPORT_PRESENTED, INTERACTION_COMPLETED, NODE_COMPLETED, SESSION_PAUSED, SESSION_RESUMED, SESSION_COMPLETED, HANDOFF_TO_GROUP]
        modality: { type: string, enum: [TOUCH, DRAG, VOICE, GROUP, SYSTEM] }
        supportLevel: { type: string, enum: [NONE, VOICE_REPEAT, VISUAL_CUE, CHOICE_REVEALED] }
        durationMs: { type: integer, minimum: 0, maximum: 3600000 }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        clientSequence: { type: integer, minimum: 1 }
        appVersion: { type: integer, minimum: 1 }
        packVersion: { type: integer, minimum: 1 }
    LearningEventBatch:
      type: object
      additionalProperties: false
      required: [sessionReceipt, events]
      properties:
        sessionReceipt: { type: string, minLength: 32, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/LearningEvent' }
    LearningEventBatchResult:
      type: object
      required: [acceptedEventIds, duplicateEventIds, rejected, highestConfirmedSequence]
      properties:
        acceptedEventIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        duplicateEventIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        rejected:
          type: array
          items:
            type: object
            required: [eventId, code]
            properties:
              eventId: { $ref: '#/components/schemas/Id' }
              code: { $ref: '#/components/schemas/Id' }
        highestConfirmedSequence: { type: integer, minimum: 0 }
    CreateTeacherObservationRequest:
      type: object
      additionalProperties: false
      required: [classroomId, category, text, visibility]
      properties:
        classroomId: { $ref: '#/components/schemas/Id' }
        learnerAlias: { type: string, maxLength: 40 }
        sessionId: { $ref: '#/components/schemas/Id' }
        objectiveId: { $ref: '#/components/schemas/Id' }
        category: { type: string, enum: [PARTICIPATION, STRATEGY, LANGUAGE, COLLABORATION, PLANNING] }
        text: { type: string, minLength: 1, maxLength: 2000 }
        visibility: { type: string, enum: [PRIVATE, SCHOOL_TEAM] }
    TeacherObservation:
      allOf:
        - $ref: '#/components/schemas/CreateTeacherObservationRequest'
        - type: object
          required: [observationId, authorUserId, createdAt, revision]
          properties:
            observationId: { $ref: '#/components/schemas/Id' }
            authorUserId: { $ref: '#/components/schemas/Id' }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
            revision: { type: integer, minimum: 1 }
    ClassroomReport:
      type: object
      required: [classroomId, period, sample, indicators, limitations]
      properties:
        classroomId: { $ref: '#/components/schemas/Id' }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        sample:
          type: object
          required: [sessions, devices, participantScope]
          properties:
            sessions: { type: integer, minimum: 0 }
            devices: { type: integer, minimum: 0 }
            participantScope: { type: string, enum: [INDIVIDUAL, GROUP, MIXED] }
        indicators:
          type: array
          items:
            type: object
            required: [id, numerator, denominator, evidenceRefs]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              numerator: { type: integer, minimum: 0 }
              denominator: { type: integer, minimum: 0 }
              evidenceRefs: { type: array, items: { $ref: '#/components/schemas/Id' } }
        limitations: { type: array, items: { type: string, maxLength: 280 } }
    Problem:
      type: object
      required: [type, title, status, code, safeMessage, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: '#/components/schemas/Id' }
        safeMessage: { type: string, maxLength: 280 }
        correlationId: { type: string, maxLength: 128 }
        issues:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              code: { $ref: '#/components/schemas/Id' }
